<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8a005c">
<meta name="description" content="ARGOS - Gestión de servicios ferroviarios">
<link rel="manifest" href="manifest.webmanifest">
<title>ARGOS · Renfe Operaciones</title>
<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   ARGOS · MENÚ PRINCIPAL · DISEÑO RENFE
   Solo afecta a la presentación. El resto de la app permanece igual.
   ========================================================= */

:root{
    --renfe:#8a005c;
    --renfe-dark:#700047;
    --page:#f4f3f5;
    --card:#ffffff;
    --ink:#25252a;
    --muted:#74747c;
    --line:rgba(25,25,30,.10);
    --shadow:0 8px 24px rgba(35,25,35,.07);
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden !important;
    overscroll-behavior:none;
}

body{
    background:var(--page);
    color:var(--ink);
}

body.dark{
    background:#151317;
}

.app-shell{
    width:100%;
    max-width:1100px;
    height:100dvh;
    min-height:100dvh;
    margin:0 auto;
    padding:0;
    display:flex;
    flex-direction:column;
    overflow:hidden !important;
}

/* ---------- CABECERA ---------- */

.app-header{
    flex:0 0 auto;
    width:100%;
    padding:0 !important;
    margin:0 !important;
}

.brand-row{
    width:100%;
    height:104px;
    min-height:104px;
    background:var(--renfe);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:0 0 26px 26px;
    box-shadow:0 5px 18px rgba(138,0,92,.18);
}

.renfe-main-logo{
    display:block;
    width:128px;
    height:auto;
    max-height:52px;
    object-fit:contain;
}

.brand-copy{
    display:none !important;
}

/* ---------- MENÚ ---------- */

#menu{
    flex:1 1 auto !important;
    min-height:0 !important;
    height:auto !important;
    overflow:hidden !important;
    display:flex !important;
    flex-direction:column !important;
}

.argos-main-menu{
    flex:1 1 auto !important;
    min-height:0 !important;
    height:auto !important;
    width:100%;
    display:grid !important;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:16px;
    padding:22px !important;
    margin:0 !important;
    box-sizing:border-box;
    overflow:hidden !important;
    align-content:stretch;
}

.argos-main-menu .menu-card{
    position:relative;
    min-width:0;
    min-height:0;
    width:100%;
    height:auto;
    margin:0;
    padding:26px;
    border:1px solid var(--line);
    border-radius:24px;
    background:var(--card);
    color:var(--ink);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    text-align:left;
    overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease;
}

.argos-main-menu .menu-card::after{
    content:"›";
    position:absolute;
    right:24px;
    bottom:20px;
    font-size:27px;
    line-height:1;
    color:var(--renfe);
    opacity:.72;
}

.argos-main-menu .menu-card.primary{
    background:var(--renfe);
    border-color:var(--renfe);
    color:#fff;
    box-shadow:0 10px 26px rgba(138,0,92,.20);
}

.argos-main-menu .menu-card.primary::after{
    color:#fff;
}

.argos-main-menu .menu-card:active{
    transform:scale(.985);
}

.argos-main-menu .card-icon{
    width:50px;
    height:50px;
    flex:0 0 50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:rgba(138,0,92,.09);
    color:var(--renfe);
    font-size:27px;
    font-weight:500;
}

.argos-main-menu .primary .card-icon{
    background:rgba(255,255,255,.15);
    color:#fff;
}

.argos-main-menu .card-content{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:7px;
    min-width:0;
    padding-right:25px;
}

.argos-main-menu .card-content strong{
    display:block;
    font-size:clamp(21px,2.5vw,30px);
    line-height:1.02;
    letter-spacing:-.025em;
}

.argos-main-menu .card-content > span{
    display:block;
    color:var(--muted);
    font-size:14px;
    line-height:1.25;
}

.argos-main-menu .primary .card-content > span{
    color:rgba(255,255,255,.84);
}

.argos-footer{
    display:none !important;
}

/* ---------- MÓVIL ---------- */

@media (max-width:700px){

    .app-shell{
        width:100%;
        height:100dvh;
        min-height:100dvh;
        overflow:hidden !important;
    }

    .brand-row{
        height:96px;
        min-height:96px;
        border-radius:0 0 24px 24px;
    }

    .renfe-main-logo{
        width:116px;
        max-height:45px;
    }

    #menu{
        height:calc(100dvh - 96px) !important;
        max-height:calc(100dvh - 96px) !important;
        overflow:hidden !important;
    }

    .argos-main-menu{
        display:grid !important;
        grid-template-columns:1fr !important;
        grid-template-rows:repeat(4,minmax(0,1fr)) !important;
        gap:10px;
        padding:12px !important;
        height:100% !important;
        min-height:0 !important;
        overflow:hidden !important;
    }

    .argos-main-menu .menu-card{
        min-height:0 !important;
        height:auto !important;
        padding:16px 18px;
        border-radius:20px;
        flex-direction:row;
        align-items:center;
        justify-content:flex-start;
        gap:16px;
        box-shadow:0 5px 16px rgba(35,25,35,.065);
    }

    .argos-main-menu .menu-card::after{
        right:17px;
        top:50%;
        bottom:auto;
        transform:translateY(-50%);
        font-size:30px;
        opacity:.55;
    }

    .argos-main-menu .card-icon{
        width:48px;
        height:48px;
        flex:0 0 48px;
        border-radius:15px;
        font-size:25px;
    }

    .argos-main-menu .card-content{
        gap:4px;
        padding-right:24px;
    }

    .argos-main-menu .card-content strong{
        font-size:20px;
        line-height:1.05;
        letter-spacing:-.015em;
    }

    .argos-main-menu .card-content > span{
        font-size:11.5px;
        line-height:1.18;
    }
}

/* ---------- PANTALLAS INTERIORES ----------
   El menú principal es fijo; las pantallas secundarias sí pueden desplazarse.
   ---------- */

.screen:not(#menu){
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
}

@media (max-width:700px){
    .screen:not(#menu){
        max-height:100dvh;
        overflow-y:auto;
    }
}

/* ---------- MODO OSCURO ---------- */

body.dark .argos-main-menu .menu-card{
    background:#222025;
    border-color:rgba(255,255,255,.08);
    color:#fff;
}

body.dark .argos-main-menu .card-content > span{
    color:#aaa6ad;
}

body.dark .argos-main-menu .card-icon{
    background:rgba(255,255,255,.07);
}
</style>
</head>

<body>

<main class="app-shell">

    <header class="app-header">
        <div class="brand-row">
            <img
                class="renfe-main-logo"
                src="icons/renfe-logo-blanco.png"
                alt="Renfe"
            >
        </div>
    </header>


    <!-- =====================================================
         ÚNICA PANTALLA PRINCIPAL
         SOLO 4 OPCIONES
         ===================================================== -->

    <section
        id="menu"
        class="screen active"
        aria-label="Menú principal"
    >

        <div class="menu-grid argos-main-menu">

            <button
                class="menu-card primary"
                data-screen="new-service"
                type="button"
            >
                <span class="card-icon">＋</span>
                <span class="card-content">
                    <strong>AÑADIR SERVICIO</strong>
                    <span>Registrar un nuevo servicio</span>
                </span>
            </button>

            <button
                class="menu-card"
                data-screen="history"
                type="button"
            >
                <span class="card-icon">▣</span>
                <span class="card-content">
                    <strong>HISTORIAL</strong>
                    <span>Consultar servicios registrados</span>
                </span>
            </button>

            <button
                class="menu-card"
                data-screen="stats"
                type="button"
            >
                <span class="card-icon">▥</span>
                <span class="card-content">
                    <strong>ESTADÍSTICAS</strong>
                    <span>Consultar tus datos de servicio</span>
                </span>
            </button>

            <button
                class="menu-card"
                data-screen="settings"
                type="button"
            >
                <span class="card-icon">⚙</span>
                <span class="card-content">
                    <strong>AJUSTES</strong>
                    <span>Apariencia y configuración</span>
                </span>
            </button>

        </div>

    </section>


    <!-- =====================================================
         SUBMENÚ: AÑADIR SERVICIO
         ===================================================== -->

    <section id="new-service" class="screen">

        <div class="screen-header">
            <button class="back-button" data-back type="button">‹</button>
            <div>
                <div class="screen-kicker">REGISTRO</div>
                <h2>Añadir servicio</h2>
            </div>
        </div>

        <form id="serviceForm" class="service-form">

            <div class="form-section-title">SERVICIO</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="train">Número de tren</label>
                    <input id="train" type="text" maxlength="5" required autocomplete="off" placeholder="Ej. 05120">
                </div>

                <div class="form-group">
                    <label for="series">Serie</label>
                    <input id="series" type="text" maxlength="3" required autocomplete="off" placeholder="Ej. 112">
                </div>
            </div>

            <div class="form-group">
                <label for="vehicle">Vehículo</label>
                <input id="vehicle" type="text" maxlength="3" autocomplete="off" placeholder="Ej. 018">
            </div>

            <div class="form-section-title">RECORRIDO</div>

            <div class="form-row">
                <div class="form-group autocomplete-group">
                    <label for="origin">Origen</label>
                    <input id="origin" required autocomplete="off" placeholder="Fuenla, 60000...">
                    <div id="originList" class="suggestions"></div>
                </div>

                <div class="form-group autocomplete-group">
                    <label for="destination">Destino</label>
                    <input id="destination" required autocomplete="off" placeholder="Jerez, 51300...">
                    <div id="destinationList" class="suggestions"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input id="date" type="date" required>
                </div>

                <div class="form-group">
                    <label for="kilometres">Kilómetros</label>
                    <input id="kilometres" type="number" min="0" step="1" placeholder="Ej. 472">
                </div>
            </div>

            <div class="form-section-title">ANOTACIONES</div>

            <div class="form-group">
                <label for="notes">Anotaciones</label>
                <textarea id="notes" rows="3" placeholder="Observaciones..."></textarea>
            </div>

            <div class="form-group">
                <label for="incidents">Incidencias</label>
                <textarea id="incidents" rows="3" placeholder="Sin incidencias"></textarea>
            </div>

            <div class="form-actions">
                <button class="save-button" type="submit">Guardar servicio</button>
                <button class="cancel-button" data-back type="button">Cancelar</button>
            </div>

        </form>

    </section>


    <!-- =====================================================
         SUBMENÚ: HISTORIAL
         ===================================================== -->

    <section id="history" class="screen">

        <div class="screen-header">
            <button class="back-button" data-back type="button">‹</button>
            <div>
                <div class="screen-kicker">REGISTROS</div>
                <h2>Historial</h2>
            </div>
        </div>

        <div id="historyList" class="history-list"></div>

    </section>


    <!-- =====================================================
         SUBMENÚ: ESTADÍSTICAS
         ===================================================== -->

    <section id="stats" class="screen">

        <div class="screen-header">
            <button class="back-button" data-back type="button">‹</button>
            <div>
                <div class="screen-kicker">DATOS</div>
                <h2>Estadísticas</h2>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Servicios</span>
                <strong id="statServices">0</strong>
            </div>

            <div class="stat-card">
                <span>Kilómetros</span>
                <strong id="statKm">0</strong>
            </div>

            <div class="stat-card">
                <span>Series diferentes</span>
                <strong id="statSeries">0</strong>
            </div>

            <div class="stat-card">
                <span>Último servicio</span>
                <strong id="statLast">—</strong>
            </div>
        </div>

    </section>


    <!-- =====================================================
         SUBMENÚ: AJUSTES
         ===================================================== -->

    <section id="settings" class="screen">

        <div class="screen-header">
            <button class="back-button" data-back type="button">‹</button>
            <div>
                <div class="screen-kicker">CONFIGURACIÓN</div>
                <h2>Ajustes</h2>
            </div>
        </div>

        <div class="settings-list">

            <div class="setting-card">

                <div>
                    <strong>Apariencia</strong>
                    <span>Selecciona el tema de ARGOS.</span>
                </div>

                <div class="theme-switch">

                    <button
                        id="lightTheme"
                        class="theme-option active"
                        type="button"
                    >
                        ☀ Claro
                    </button>

                    <button
                        id="darkTheme"
                        class="theme-option"
                        type="button"
                    >
                        ☾ Oscuro
                    </button>

                </div>

            </div>

        </div>

    </section>


    <footer class="app-footer argos-footer">
        <span>ARGOS</span>
        <span>Renfe · Operaciones</span>
    </footer>

</main>


<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>

</body>
</html>

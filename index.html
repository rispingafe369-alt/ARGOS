<style>
/* =========================================================
   CORRECCIÓN MÓVIL — AÑADIR SERVICIO
   ========================================================= */

/* El menú principal NO puede quedarse visible detrás
   de una pantalla secundaria en móvil. */
@media (max-width:600px){
  .menu-screen:not(.active){
    display:none!important;
  }

  #new-service{
    display:none;
    flex:1 1 auto!important;
    min-height:0!important;
    height:auto!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:20px 14px calc(30px + env(safe-area-inset-bottom))!important;
  }

  #new-service.active{
    display:block!important;
  }

  #new-service .service-form{
    width:100%!important;
    max-width:720px;
    margin:0 auto;
    padding-bottom:20px!important;
  }

  #new-service .screen-header{
    width:100%!important;
    margin:0 auto 18px!important;
  }

  #new-service .screen-header h2{
    line-height:1.05!important;
  }

  #new-service .form-section-title{
    margin-top:24px!important;
  }

  /* Evita que los elementos del formulario se monten unos sobre otros. */
  #new-service .form-group,
  #new-service .repeatable-group,
  #new-service .form-actions{
    position:relative!important;
    z-index:1;
  }

  #new-service .label-line{
    min-height:24px;
    flex-wrap:wrap;
  }

  #new-service .field-hint{
    white-space:normal!important;
    text-align:right;
  }

  /* El botón de guardar ya no se queda flotando encima del formulario. */
  #new-service .form-actions{
    position:relative!important;
    bottom:auto!important;
    padding:12px 0 0!important;
    background:none!important;
    display:flex!important;
    flex-direction:column!important;
    gap:9px!important;
  }

  #new-service .form-actions button{
    width:100%!important;
    min-height:54px;
  }

  /* =====================================================
     SELECT DE PRODUCTO PERSONALIZADO
     No usamos el desplegable nativo de Android.
     ===================================================== */

  #new-service .product-native-select{
    position:absolute!important;
    width:1px!important;
    height:1px!important;
    opacity:0!important;
    pointer-events:none!important;
    overflow:hidden!important;
  }

  #new-service .product-custom-trigger{
    width:100%;
    min-height:52px;
    border:1px solid var(--line);
    border-radius:15px;
    background:var(--card);
    color:var(--ink);
    padding:14px 46px 14px 15px;
    text-align:left;
    position:relative;
    box-shadow:0 3px 12px rgba(30,20,30,.035);
  }

  #new-service .product-custom-trigger::after{
    content:"";
    position:absolute;
    right:18px;
    top:50%;
    width:9px;
    height:9px;
    border-right:2px solid var(--renfe);
    border-bottom:2px solid var(--renfe);
    transform:translateY(-65%) rotate(45deg);
  }

  #new-service .product-custom-trigger.placeholder{
    color:var(--muted);
  }

  .argos-product-picker{
    position:fixed;
    inset:0;
    z-index:3000;
    display:none;
  }

  .argos-product-picker.open{
    display:block;
  }

  .argos-product-picker-backdrop{
    position:absolute;
    inset:0;
    background:rgba(12,8,12,.48);
    backdrop-filter:blur(4px);
  }

  .argos-product-picker-panel{
    position:absolute;
    left:14px;
    right:14px;
    bottom:14px;
    max-height:min(78dvh,620px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 18px 55px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
  }

  .argos-product-picker-header{
    flex:0 0 auto;
    padding:17px 18px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .argos-product-picker-header strong{
    color:var(--ink);
    font-size:18px;
  }

  .argos-product-picker-close{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:var(--soft);
    color:var(--renfe);
    font-size:25px;
    line-height:1;
  }

  .argos-product-picker-list{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  .argos-product-option{
    width:100%;
    min-height:55px;
    border:0;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    text-align:left;
    font-size:16px;
  }

  .argos-product-option:last-child{
    border-bottom:0;
  }

  .argos-product-option:active{
    background:var(--soft);
  }

  .argos-product-option.selected{
    color:var(--renfe);
    font-weight:800;
    background:var(--soft);
  }

  .argos-product-option .product-check{
    width:22px;
    height:22px;
    border:2px solid var(--line);
    border-radius:50%;
    flex:0 0 auto;
    position:relative;
  }

  .argos-product-option.selected .product-check{
    border-color:var(--renfe);
  }

  .argos-product-option.selected .product-check::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--renfe);
    left:4px;
    top:4px;
  }

  body.dark .argos-product-picker-backdrop{
    background:rgba(0,0,0,.62);
  }

  @media (min-width:601px){
    .argos-product-picker{
      display:none!important;
    }
  }
}
</style>

<script>
/* =========================================================
   SELECT PERSONALIZADO DE PRODUCTO EN MÓVIL
   ========================================================= */
(function(){
  function initProductPicker(){
    const select = document.getElementById("product");
    if(!select || select.dataset.customPickerReady === "1") return;

    select.dataset.customPickerReady = "1";
    select.classList.add("product-native-select");

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "product-custom-trigger placeholder";
    trigger.textContent = select.options[0]?.textContent || "Selecciona un producto";
    select.parentNode.insertBefore(trigger, select);

    const picker = document.createElement("div");
    picker.className = "argos-product-picker";
    picker.innerHTML = `
      <div class="argos-product-picker-backdrop"></div>
      <div class="argos-product-picker-panel" role="dialog" aria-modal="true" aria-label="Selecciona un producto">
        <div class="argos-product-picker-header">
          <strong>Selecciona un producto</strong>
          <button type="button" class="argos-product-picker-close" aria-label="Cerrar">×</button>
        </div>
        <div class="argos-product-picker-list"></div>
      </div>
    `;
    document.body.appendChild(picker);

    const list = picker.querySelector(".argos-product-picker-list");
    const closeButton = picker.querySelector(".argos-product-picker-close");
    const backdrop = picker.querySelector(".argos-product-picker-backdrop");

    function renderOptions(){
      list.innerHTML = "";

      Array.from(select.options).forEach(option => {
        if(option.value === "") return;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "argos-product-option";
        button.dataset.value = option.value;
        button.innerHTML = `
          <span>${option.textContent}</span>
          <span class="product-check" aria-hidden="true"></span>
        `;

        if(select.value === option.value){
          button.classList.add("selected");
        }

        button.addEventListener("click", function(){
          select.value = option.value;
          select.dispatchEvent(new Event("change", {bubbles:true}));
          closePicker();
        });

        list.appendChild(button);
      });
    }

    function syncTrigger(){
      const option = select.options[select.selectedIndex];
      const hasValue = !!select.value;

      trigger.textContent = hasValue
        ? option.textContent
        : (select.options[0]?.textContent || "Selecciona un producto");

      trigger.classList.toggle("placeholder", !hasValue);

      list.querySelectorAll(".argos-product-option").forEach(button => {
        button.classList.toggle("selected", button.dataset.value === select.value);
      });
    }

    function openPicker(){
      renderOptions();
      syncTrigger();
      picker.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePicker(){
      picker.classList.remove("open");
      document.body.style.overflow = "";
    }

    trigger.addEventListener("click", openPicker);
    closeButton.addEventListener("click", closePicker);
    backdrop.addEventListener("click", closePicker);

    select.addEventListener("change", syncTrigger);

    document.addEventListener("keydown", function(event){
      if(event.key === "Escape" && picker.classList.contains("open")){
        closePicker();
      }
    });

    syncTrigger();
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", initProductPicker);
  }else{
    initProductPicker();
  }
})();
</script>
